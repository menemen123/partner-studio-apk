name: Build firm APK
run-name: Build ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable request ID created by the admin APK
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: partner-studio-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check common authentication setup
        env:
          OBUS_MT_AUTH: ${{ secrets.OBUS_MT_AUTH }}
          OBUS_RX_AUTH: ${{ secrets.OBUS_RX_AUTH }}
        run: python3 -c "from builder.build import required_common_auth; required_common_auth()"
      - name: Restore packaged template
        run: python3 cloud/join_template.py
      - name: Install build tools
        run: python3 scripts/setup_tools.py
      - name: Install signing encryption library
        run: python3 -m pip install cryptography==46.0.3
      - name: Build and publish downloadable APK
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          STUDIO_MASTER_KEY: ${{ secrets.STUDIO_MASTER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OBUS_MT_AUTH: ${{ secrets.OBUS_MT_AUTH }}
          OBUS_RX_AUTH: ${{ secrets.OBUS_RX_AUTH }}
        run: python3 cloud/build_request.py --request "$REQUEST_ID"
